name: Deploy Docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: vercel-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: ui/go.mod

      - uses: oven-sh/setup-bun@v2

      - name: Pull Vercel project settings
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            bunx vercel@59.1.4 pull --yes --environment=production --token="$VERCEL_TOKEN"
          else
            bunx vercel@59.1.4 pull --yes --environment=preview --token="$VERCEL_TOKEN"
          fi

      - name: Build docs with Vercel
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            bunx vercel@59.1.4 build --prod --token="$VERCEL_TOKEN"
          else
            bunx vercel@59.1.4 build --token="$VERCEL_TOKEN"
          fi

      - name: Deploy prebuilt docs
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            bunx vercel@59.1.4 deploy --prebuilt --prod --token="$VERCEL_TOKEN"
          else
            bunx vercel@59.1.4 deploy --prebuilt --token="$VERCEL_TOKEN"
          fi
