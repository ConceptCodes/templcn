name: Release CLI

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: ui/go.mod

      - uses: oven-sh/setup-bun@v2

      - name: Install docs dependencies
        run: bun install --frozen-lockfile
        working-directory: docs-site

      - name: Build embedded runtime
        run: bun run build:tanstack
        working-directory: docs-site

      - name: Generate embedded CLI assets
        run: go generate ./...
        working-directory: cli

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -ldflags='-s -w' -o "../templcn-${{ matrix.goos }}-${{ matrix.goarch }}" .
        working-directory: cli

      - uses: actions/upload-artifact@v4
        with:
          name: templcn-${{ matrix.goos }}-${{ matrix.goarch }}
          path: templcn-${{ matrix.goos }}-${{ matrix.goarch }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --generate-notes
